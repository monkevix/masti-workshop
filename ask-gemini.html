<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Gemini (OpenRouter)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #fbe9d2;
            font-family: Arial, sans-serif;
            color: #111;
        }
        .topbar {
            position: sticky;
            top: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #fff;
            border-bottom: 2px solid black;
        }
        .gear {
            font-size: 22px;
            cursor: pointer;
            border: none;
            background: transparent;
        }
        .settings {
            display: none;
            padding: 16px;
            background: #fff;
            border-bottom: 2px solid black;
        }
        .settings.open { display: block; }
        .settings label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .settings input {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #777;
            border-radius: 6px;
        }
        .settings button {
            padding: 8px 16px;
            border: 1px solid #777;
            border-radius: 6px;
            background: #dfb47e;
            cursor: pointer;
        }
        .container {
            max-width: 720px;
            margin: 24px auto;
            padding: 0 16px;
        }
        .chat {
            background: #fff;
            border: 2px solid black;
            border-radius: 12px;
            padding: 16px;
            min-height: 200px;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .input-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .input-row input {
            flex: 1;
            padding: 10px;
            border: 1px solid #777;
            border-radius: 6px;
            font-size: 16px;
        }
        .input-row button {
            padding: 10px 16px;
            border: 1px solid #777;
            border-radius: 6px;
            background: #eee;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <button class="gear" id="gear" title="Settings">⚙️</button>
        <strong>Ask Gemini (OpenRouter)</strong>
    </div>

    <div class="settings" id="settings">
        <label for="apiKey">OpenRouter API Key</label>
        <input type="password" id="apiKey" placeholder="sk-or-...">
        <label for="model">Model (free)</label>
        <input type="text" id="model" placeholder="meta-llama/llama-3.2-3b-instruct:free">
        <button id="saveSettings">Save</button>
    </div>

    <div class="container">
        <div class="chat" id="chat">Ask a question below and press Enter.</div>
        <div class="input-row">
            <input type="text" id="question" placeholder="Type your question...">
            <button id="send">Send</button>
        </div>
    </div>

    <script>
        const gear = document.getElementById("gear");
        const settings = document.getElementById("settings");
        const apiKeyInput = document.getElementById("apiKey");
        const modelInput = document.getElementById("model");
        const saveBtn = document.getElementById("saveSettings");
        const chat = document.getElementById("chat");
        const questionInput = document.getElementById("question");
        const sendBtn = document.getElementById("send");

        // Load saved settings
        apiKeyInput.value = localStorage.getItem("or_key") || "";
        modelInput.value = localStorage.getItem("or_model") || "meta-llama/llama-3.2-3b-instruct:free";

        gear.addEventListener("click", function () {
            settings.classList.toggle("open");
        });

        saveBtn.addEventListener("click", function () {
            localStorage.setItem("or_key", apiKeyInput.value.trim());
            localStorage.setItem("or_model", modelInput.value.trim());
            settings.classList.remove("open");
        });

        async function ask() {
            const key = localStorage.getItem("or_key");
            const model = localStorage.getItem("or_model") || "meta-llama/llama-3.2-3b-instruct:free";
            const question = questionInput.value.trim();
            if (!key) { chat.textContent = "Please save your API key first (⚙️)."; return; }
            if (!question) return;

            chat.textContent = "";
            questionInput.value = "";

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + key,
                        "HTTP-Referer": window.location.href,
                        "X-Title": "Ask Gemini Workshop"
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: "user", content: question }],
                        stream: true
                    })
                });

                if (!response.ok) {
                    const err = await response.text();
                    chat.textContent = "Error: " + err;
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop();

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed.startsWith("data:")) continue;
                        const data = trimmed.slice(5).trim();
                        if (data === "[DONE]") continue;
                        try {
                            const json = JSON.parse(data);
                            const chunk = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content;
                            if (chunk) chat.textContent += chunk;
                        } catch (e) {
                            // ignore partial chunks
                        }
                    }
                }
            } catch (error) {
                chat.textContent = "Error: " + error.message;
            }
        }

        sendBtn.addEventListener("click", ask);
        questionInput.addEventListener("keydown", function (e) {
            if (e.key === "Enter") ask();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Card</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="navbar">
        <a href="/">Home</a>
        <a href="ask-gemini.html" target="_blank">Ask Gemini</a>
    </div>

    <main>
        <section class="user-card" aria-label="User profile">
            <img id="user-image" src="https://randomuser.me/api/portraits/women/44.jpg" alt="User portrait">
            <h1 id="user-name">Jane Doe</h1>
            <p id="user-gender">Female</p>
            <button id="toggle-button" class="toggle-button">Toggle User</button>
            <button id="random-button" class="random-button">Random User</button>
        </section>
    </main>
    <script src="index.js"></script>
</body>
</html>
